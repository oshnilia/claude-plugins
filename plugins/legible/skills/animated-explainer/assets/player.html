<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>TITLE</title>
<!-- legible step player. One offline file: no network, no audio. Steps: any SVG element with data-s="N" appears at
     step N and stays; data-only="N" shows only at step N. Captions: <li data-n="N"> in #captions. -->
<style>
:root { --bg:#ffffff; --fg:#1d1d22; --muted:#5d6068; --accent:#2f62e0; --line:#c9ccd4; --panel:#f3f4f7; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#141518; --fg:#ececf0; --muted:#a2a5ad; --accent:#7ea3ff; --line:#3a3d45; --panel:#1e2024; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.35rem; margin: 0.2em 0 0.1em; }
.answer { color: var(--muted); margin: 0 0 12px; }
figure { margin: 0; background: var(--panel); border-radius: 10px; padding: 8px; }
svg { width: 100%; height: auto; display: block; color: var(--fg); }
svg text { fill: currentColor; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
[data-s], [data-only] { transition: opacity 0.45s ease; }
.off { opacity: 0; pointer-events: none; }
.now { color: var(--accent); }
.now :is(rect, path, line, circle, ellipse, polygon, polyline) { stroke: var(--accent); }
path[pathLength="1"] { stroke-dasharray: 1; stroke-dashoffset: 0; transition: stroke-dashoffset 0.9s ease, opacity 0.45s ease; }
path[pathLength="1"].off { stroke-dashoffset: 1; }
.lit { color: var(--accent); }
.caption { min-height: 3.2em; margin: 12px 0 8px; font-size: 1.05rem; }
.caption b { color: var(--accent); margin-right: 0.4em; }
#captions { display: none; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.controls button:focus-visible, .controls input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.controls input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
.counter { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 5.5em; text-align: right; }
@media (prefers-reduced-motion: reduce) {
  [data-s], [data-only], path[pathLength="1"] { transition: none; }
  .play { display: none; }
}
@media print {
  .controls { display: none; }
  .off { opacity: 1 !important; }
  #captions { display: block; }
}
</style>
</head>
<body>
<main>
  <h1>TITLE</h1>
  <p class="answer">ANSWER IN ONE SENTENCE</p>
  <figure>
    <svg viewBox="0 0 900 420" role="img" aria-labelledby="fig-title">
      <title id="fig-title">TITLE</title>
      <!-- DIAGRAM: give each part data-s="N"; draw edges as <path pathLength="1" .../> to draw them in. -->
    </svg>
  </figure>
  <p class="caption" id="caption" aria-live="polite" data-hint="Full picture. Press ▶ Play or › to build it step by step."></p>
  <ol id="captions">
    <!-- <li data-n="1">What happens at step 1, one sentence.</li> -->
  </ol>
  <div class="controls">
    <button class="prev" type="button" aria-label="Previous step">‹</button>
    <button class="play" type="button" aria-label="Play">▶ Play</button>
    <button class="next" type="button" aria-label="Next step">›</button>
    <input class="scrub" type="range" min="0" value="0" aria-label="Step">
    <span class="counter" data-overview="overview"></span>
  </div>
</main>
<script>
(function () {
  var parts = Array.prototype.slice.call(document.querySelectorAll("[data-s],[data-only]"));
  var caps = {};
  Array.prototype.forEach.call(document.querySelectorAll("#captions li[data-n]"), function (li) {
    caps[+li.getAttribute("data-n")] = li.textContent.trim();
  });
  var last = 0;
  parts.forEach(function (el) { last = Math.max(last, +(el.getAttribute("data-s") || el.getAttribute("data-only"))); });
  Object.keys(caps).forEach(function (n) { last = Math.max(last, +n); });
  var q = function (s) { return document.querySelector(s); };
  var scrub = q(".scrub"), counter = q(".counter"), caption = q("#caption"), play = q(".play");
  scrub.max = String(last);
  var step = 0, timer = null;
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Step 0 is the full picture: everything shows. Steps 1..last build it up in order.
  function show(n) {
    step = Math.max(0, Math.min(last, n));
    parts.forEach(function (el) {
      var s = el.getAttribute("data-s"), o = el.getAttribute("data-only");
      var on = step === 0 ? o === null : (s !== null ? +s <= step : +o === step);
      el.classList.toggle("off", !on);
      el.classList.toggle("now", step > 0 && (+s === step || +o === step));
    });
    scrub.value = String(step);
    counter.textContent = step === 0 ? counter.getAttribute("data-overview") : step + " / " + last;
    caption.innerHTML = "";
    if (step > 0) { var b = document.createElement("b"); b.textContent = step + "."; caption.appendChild(b); }
    caption.appendChild(document.createTextNode(step === 0 ? caption.getAttribute("data-hint") : (caps[step] || "")));
    if (history.replaceState) history.replaceState(null, "", step === 0 ? location.pathname : "#step=" + step);
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } play.textContent = "▶ Play"; play.setAttribute("aria-label", "Play"); }
  function start() {
    if (still) return;
    if (step === 0 || step === last) show(1);
    play.textContent = "❚❚ Pause"; play.setAttribute("aria-label", "Pause");
    timer = setInterval(function () { if (step >= last) { stop(); return; } show(step + 1); }, 3500);
  }
  q(".prev").addEventListener("click", function () { stop(); show(step - 1); });
  q(".next").addEventListener("click", function () { stop(); show(step + 1); });
  play.addEventListener("click", function () { timer ? stop() : start(); });
  scrub.addEventListener("input", function () { stop(); show(+scrub.value); });
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") { stop(); show(step + 1); }
    else if (e.key === "ArrowLeft") { stop(); show(step - 1); }
    else if (e.key === " ") { e.preventDefault(); timer ? stop() : start(); }
  });
  // Hover or focus on an element with data-ref lights up every element with the same data-ref.
  Array.prototype.forEach.call(document.querySelectorAll("[data-ref]"), function (el) {
    var on = function (v) { return function () {
      Array.prototype.forEach.call(document.querySelectorAll('[data-ref="' + el.getAttribute("data-ref") + '"]'),
        function (x) { x.classList.toggle("lit", v); });
    }; };
    el.addEventListener("mouseenter", on(true)); el.addEventListener("mouseleave", on(false));
    el.addEventListener("focus", on(true)); el.addEventListener("blur", on(false));
  });
  var m = /#step=(\d+)/.exec(location.hash);
  show(m ? +m[1] : 0);
})();
</script>
</body>
</html>
