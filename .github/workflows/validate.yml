name: validate
on: [push, pull_request]

# The job only reads the repository. It has no secrets, so a pull request from a fork cannot leak anything.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned by commit SHA; Dependabot proposes updates (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      # Pinned to the version the plugins were tested on. Raise it in a pull request after a test run.
      - run: npm install -g --include=optional @anthropic-ai/claude-code@2.1.288
      - name: Validate marketplace
        run: claude plugin validate .
      - name: Validate each plugin
        run: for d in plugins/*/; do claude plugin validate "$d" || exit 1; done
      - name: No variable may shadow the JSX factory h
        run: "! grep -nE '(\\(|,|\\s)h\\s*=>|\\b(const|let|var) h\\b' plugins/session-board/hooks/*.tsx"
      - name: No personal paths or email addresses in the repository
        run: |
          # Every tracked file: the docs, README and CHANGELOG are public too, not only what a plugin ships.
          # -o checks each match on its own, so an allowed address does not hide another one on the same line.
          # example.com/.org/.net are reserved for examples (RFC 2606) and appear in eval cases.
          if git grep -nIoE '/Users/[A-Za-z0-9_.-]+/|/home/[A-Za-z0-9_.-]+/|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}' \
            | grep -vE 'noreply@anthropic\.com|users\.noreply\.github\.com|@example\.(com|org|net)$'; then
            echo "Remove the personal data above before merging."; exit 1
          fi
      - name: Test session-board mod
        run: claude plugin test plugins/session-board
      - name: Test lean hook
        run: sh plugins/lean/tests/hook.sh
      - name: Test notion-tasks hook
        run: sh plugins/notion-tasks/tests/hook.sh
      - name: Test obsidian-tasks hook
        run: sh plugins/obsidian-tasks/tests/hook.sh
      - name: Plain-style scorer self-test
        # cp1252: the code page of a pipe on Windows; the scorers must still read and print Russian
        run: |
          export PYTHONIOENCODING=cp1252
          python3 plugins/legible/skills/plain-english/scripts/ste_score.py --self-test && python3 plugins/legible/skills/plain-russian/scripts/ru_score.py --self-test
