name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g --include=optional @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate .
      - name: Validate each plugin
        run: for d in plugins/*/; do claude plugin validate "$d" || exit 1; done
      - name: No variable may shadow the JSX factory h
        run: "! grep -nE '(\\(|,|\\s)h\\s*=>|\\b(const|let|var) h\\b' plugins/session-board/hooks/*.tsx"
      - name: Test session-board mod
        run: claude plugin test plugins/session-board
      - name: Plain-style scorer self-test
        run: python3 plugins/legible/skills/plain-english/scripts/ste_score.py --self-test && python3 plugins/legible/skills/plain-russian/scripts/ru_score.py --self-test
