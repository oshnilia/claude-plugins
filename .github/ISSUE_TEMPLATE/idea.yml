name: Idea or question
description: A new feature, a change, or a question about how something works
labels: [idea]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options: [session-board, legible, marketplace, other]
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you try to do, and what gets in the way? One real example helps most.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Your idea
      description: Optional. How you would solve it.
